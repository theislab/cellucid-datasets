name: Dataset contracts

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24", "26"]

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Validate the complete catalog and repository layout
        run: >-
          node --test
          tests/catalog-contract.test.mjs
          tests/repository-organization-contract.test.mjs
          tests/session-presets-contract.test.mjs

  publisher:
    # The staged publisher in scripts/pinned_build.py, which both sample
    # builders publish through, is POSIX-only by construction: it fsyncs the
    # parent directory through os.open(directory, O_RDONLY), which Windows
    # refuses, and it checks filesystem ownership through os.getuid(). Its
    # suite is therefore run on the two platforms a store can actually be
    # published from. The module imports nothing outside the standard library
    # at import time -- every numerical import is function-local, and the suite
    # exercises only the stage/validate/publish helpers -- so this job installs
    # no dependencies.
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Validate the staged publisher preserves the prior store
        run: >-
          python -m unittest
          tests/test_pinned_build_publish.py

  stores:
    # Every published store opened the way a user opens it, with anndata, at
    # the versions requirements-build.lock pins for the builds that wrote them.
    name: AnnData stores / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the AnnData reader
        run: python -m pip install anndata==0.12.19 zarr==3.1.4 numcodecs==0.16.3

      - name: Open every published store with anndata
        run: >-
          python -m unittest
          tests/test_anndata_stores.py
